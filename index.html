<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INK-FUN</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 107, 0, 0.2) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 100%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 107, 0, 0.2);
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 107, 0, 0.15);
            transition: 0.3s;
        }

        .card:hover {
            box-shadow: 0 0 100px rgba(255, 107, 0, 0.3);
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #ff6b00, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            display: inline-block;
        }

        .tagline {
            color: #888;
            font-size: 1rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #ff6b00, #ffcc00);
            color: #0a0a0a;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.4);
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .links a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .links a:hover {
            color: #ff6b00;
        }

        .footer {
            font-size: 0.7rem;
            color: #555;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">INK-FUN</div>
        <div class="tagline">визитка</div>
        
        <a href="https://raw.githubusercontent.com/ink-fun/ink-fun.github.io/refs/heads/main/start.bat" class="btn" download>USE</a>

        <div class="links">
            <a href="https://github.com/ink-fun/ink-fun.github.io/" target="_blank">GitHub</a>
        </div>

        <div class="footer">2026 · ink-fun</div>
    </div>
</body>
</html>
