<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030303">
  <meta name="description" content="404 — эта ссылка никуда не ведёт.">
  <title>404 — ссылка никуда не ведёт</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23060606'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-size='34' font-weight='700' fill='%23e8e8e8'%3E4%3C/text%3E%3C/svg%3E">

  <style>
    :root {
      color-scheme: dark;
      --bg: #030303;
      --bg-2: #070707;
      --text: #efefed;
      --muted: #8b8b88;
      --line: rgba(255, 255, 255, 0.09);
      --line-soft: rgba(255, 255, 255, 0.045);
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 48%, rgba(255,255,255,.025), transparent 28%),
        radial-gradient(circle at 18% 20%, rgba(255,255,255,.012), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .space {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    .space::before {
      content: "";
      position: absolute;
      inset: -20%;
      z-index: -5;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 23%, rgba(255,255,255,.012) 24%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.018), transparent 48%);
      filter: blur(12px);
      animation: universe-drift 28s ease-in-out infinite alternate;
    }

    .stars,
    .dust {
      position: absolute;
      inset: 0;
      pointer-events: none;
      will-change: transform;
    }

    .stars {
      z-index: -3;
    }

    .dust {
      z-index: -4;
      opacity: .55;
      background:
        radial-gradient(circle at 15% 34%, rgba(255,255,255,.045) 0 1px, transparent 1.5px),
        radial-gradient(circle at 74% 67%, rgba(255,255,255,.032) 0 1px, transparent 1.5px),
        radial-gradient(circle at 34% 78%, rgba(255,255,255,.025) 0 1px, transparent 1.5px);
      background-size: 260px 260px, 330px 330px, 410px 410px;
      animation: dust-drift 70s linear infinite;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255,255,255,.64);
      box-shadow: 0 0 8px rgba(255,255,255,.12);
      animation: twinkle var(--duration) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 36%, rgba(0,0,0,.3) 74%, rgba(0,0,0,.72) 100%);
    }

    .content {
      width: min(900px, calc(100% - 40px));
      padding: 32px 0;
      text-align: center;
      transform: translate3d(var(--content-x, 0px), var(--content-y, 0px), 0);
    }

    .code {
      margin-bottom: 24px;
      color: #686865;
      font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .22em;
      text-transform: uppercase;
      animation: fade-up .9s var(--ease) both;
    }

    h1 {
      max-width: 850px;
      margin: 0 auto;
      color: #e9e9e7;
      font-size: clamp(2.2rem, 6vw, 5rem);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -.055em;
      text-wrap: balance;
      text-shadow: 0 0 35px rgba(255,255,255,.09);
      animation: fade-up 1s .12s var(--ease) both;
    }

    .subtle {
      width: min(490px, 100%);
      margin: 24px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      animation: fade-up 1s .22s var(--ease) both;
    }

    .home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 196px;
      min-height: 52px;
      margin-top: 34px;
      padding: 0 22px;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 12px;
      background: rgba(255,255,255,.035);
      color: #ededeb;
      box-shadow:
        0 10px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.04);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -.01em;
      transition:
        transform .2s var(--ease),
        background-color .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
      animation: fade-up 1s .32s var(--ease) both;
    }

    .home::after {
      content: "→";
      margin-left: 10px;
      color: #858581;
      transform: translateX(0);
      transition: transform .2s var(--ease);
    }

    .home:hover {
      transform: translateY(-3px) scale(1.02);
      background: rgba(255,255,255,.07);
      border-color: rgba(255,255,255,.28);
      box-shadow:
        0 16px 42px rgba(0,0,0,.44),
        0 0 26px rgba(255,255,255,.045);
    }

    .home:hover::after {
      transform: translateX(3px);
    }

    .home:active {
      transform: translateY(0) scale(.98);
    }

    .home:focus-visible {
      outline: 2px solid #e6e6e2;
      outline-offset: 4px;
    }

    .footer {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      color: #4f4f4d;
      font: 10px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
      animation: fade-in 1.2s .55s var(--ease) both;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes twinkle {
      from {
        opacity: .12;
        transform: scale(.8);
      }
      to {
        opacity: .65;
        transform: scale(1.25);
      }
    }

    @keyframes dust-drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(-18px, 12px, 0) scale(1.03); }
    }

    @keyframes universe-drift {
      from { transform: scale(1) translate3d(0, 0, 0); }
      to { transform: scale(1.04) translate3d(10px, -8px, 0); }
    }

    @media (max-width: 600px) {
      .content {
        width: min(100% - 28px, 900px);
      }

      .code {
        margin-bottom: 18px;
        font-size: 9px;
      }

      h1 {
        font-size: clamp(2.2rem, 11vw, 3.8rem);
      }

      .subtle {
        margin-top: 19px;
        font-size: 13px;
      }

      .home {
        width: min(100%, 280px);
        margin-top: 28px;
      }

      .footer {
        bottom: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="space" id="space">
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="dust" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="content" aria-labelledby="title">
      <div class="code">404 / lost in space</div>

      <h1 id="title">все дороги ведут в рим,<br>но эта ссылка никуда не ведёт</h1>

      <p class="subtle">
        похоже, ты свернул немного не туда.
        здесь только пустота, звёзды и отсутствие нужной страницы.
      </p>

      <a class="home" href="./index.html">вернуться домой</a>
    </section>

    <div class="footer">ink-fun / deep space</div>
  </main>

  <script>
    (() => {
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const starsContainer = document.getElementById("stars");
      const space = document.getElementById("space");
      const content = document.querySelector(".content");

      if (!reducedMotion) {
        const count = Math.min(95, Math.max(45, Math.floor(window.innerWidth / 14)));

        for (let i = 0; i < count; i++) {
          const star = document.createElement("span");
          star.className = "star";

          const size = Math.random() < 0.82 ? 1 : 2;
          star.style.width = size + "px";
          star.style.height = size + "px";
          star.style.left = (Math.random() * 100) + "%";
          star.style.top = (Math.random() * 100) + "%";
          star.style.setProperty("--duration", (2.8 + Math.random() * 4.8).toFixed(2) + "s");
          star.style.setProperty("--delay", (-Math.random() * 6).toFixed(2) + "s");

          starsContainer.appendChild(star);
        }

        let raf = null;
        let targetX = 0;
        let targetY = 0;

        window.addEventListener("pointermove", (event) => {
          targetX = (event.clientX / window.innerWidth - 0.5) * 10;
          targetY = (event.clientY / window.innerHeight - 0.5) * 7;

          if (!raf) {
            raf = requestAnimationFrame(() => {
              starsContainer.style.transform = `translate3d(${targetX * .7}px, ${targetY * .7}px, 0)`;
              content.style.setProperty("--content-x", `${targetX * .18}px`);
              content.style.setProperty("--content-y", `${targetY * .18}px`);
              raf = null;
            });
          }
        }, { passive: true });
      } else {
        content.style.setProperty("--content-x", "0px");
        content.style.setProperty("--content-y", "0px");
      }
    })();
  </script>
</body>
</html>
